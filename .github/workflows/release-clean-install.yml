name: Release Clean Install

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub Release tag to validate"
        required: true
        default: "v0.2.1"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi
          VER="${TAG#v}"
          FULL="RASPA3_CAMPAIGN_MANAGER_v${VER}_FULL.zip"
          ROOT="RASPA3_CAMPAIGN_MANAGER_v${VER}_FULL"
          INSTALLER="INSTALL_RASPA3_CAMPAIGN_MANAGER_WSL_v${VER}.sh"
          SMOKE="RUN_RCM_${VER//./_}_INSTALL_SMOKE_TEST.sh"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"
          echo "smoke=$SMOKE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download FULL release bundle and checksum
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FULL: ${{ steps.release.outputs.full }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl -fL --retry 5 --retry-all-errors -o "$FULL" "$BASE/$FULL"
          curl -fL --retry 5 --retry-all-errors -o "${FULL}.sha256" "$BASE/${FULL}.sha256"
          test -s "$FULL"
          test -s "${FULL}.sha256"

      - name: Verify FULL ZIP SHA-256
        shell: bash
        env:
          FULL: ${{ steps.release.outputs.full }}
        run: |
          set -euo pipefail
          sha256sum -c "${FULL}.sha256"

      - name: Verify ZIP integrity and required members
        shell: bash
        env:
          FULL: ${{ steps.release.outputs.full }}
          ROOT: ${{ steps.release.outputs.root }}
          INSTALLER: ${{ steps.release.outputs.installer }}
          SMOKE: ${{ steps.release.outputs.smoke }}
          VER: ${{ steps.release.outputs.ver }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          p=os.environ["FULL"]; root=os.environ["ROOT"]; ver=os.environ["VER"]
          required={
              f"{root}/{os.environ['INSTALLER']}",
              f"{root}/{os.environ['SMOKE']}",
              f"{root}/raspa_campaign_manager-{ver}-py3-none-any.whl",
              f"{root}/raspa_campaign_manager_v{ver}.pyz",
              f"{root}/RASPA3_CAMPAIGN_MANAGER_v{ver}_SOURCE.zip",
              f"{root}/qualification_evidence/CPU_PARALLELISM_RESULT.json",
              f"{root}/qualification_evidence/QUALIFICATION_RESULT.json",
          }
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC error: {bad}")
              missing=sorted(required-set(z.namelist()))
              if missing:
                  raise SystemExit("Missing members: "+", ".join(missing))
          print("ZIP_CRC=PASS")
          print("EXPECTED_MEMBERS=PASS")
          PY

      - name: Extract FULL bundle
        shell: bash
        env:
          FULL: ${{ steps.release.outputs.full }}
        run: |
          set -euo pipefail
          unzip -q "$FULL"

      - name: Clean install into isolated HOME
        shell: bash
        env:
          FULL: ${{ steps.release.outputs.full }}
          ROOT: ${{ steps.release.outputs.root }}
          INSTALLER: ${{ steps.release.outputs.installer }}
          SMOKE: ${{ steps.release.outputs.smoke }}
          VER: ${{ steps.release.outputs.ver }}
        run: |
          set -euo pipefail
          TEST_HOME="$RUNNER_TEMP/rcm-clean-home"
          mkdir -p "$TEST_HOME"
          PKG="$GITHUB_WORKSPACE/$ROOT"
          HOME="$TEST_HOME" bash "$PKG/$INSTALLER" --bundle "$GITHUB_WORKSPACE/$FULL"
          CLI="$TEST_HOME/.local/opt/raspa-campaign-manager/releases/$VER/venv/bin/raspa-campaign"
          test -x "$CLI"
          test "$("$CLI" --version)" = "raspa-campaign $VER"
          HOME="$TEST_HOME" bash "$PKG/$SMOKE"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Release clean-install PASS"
            echo ""
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Python: \`${{ matrix.python-version }}\`"
            echo "- FULL ZIP checksum: PASS"
            echo "- ZIP CRC: PASS"
            echo "- isolated install: PASS"
            echo "- CLI smoke test: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
